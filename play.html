<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>单词保卫战</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="phone-orientation.css">
<script defer src="phone-orientation.js"></script>
</head>
<body>

<div id="home">
  <div class="speed" id="speed"></div>
  <div class="levels" id="levels"></div>
  <div id="switch" style="display:none"><a class="b-sub" href="index.html">← 换一个单元</a></div>
</div>

<div id="game" class="hide">
  <div id="bar">
    <button class="bbtn" id="quit" title="返回">✕</button>
    <button class="bbtn" id="pause" title="暂停">⏸</button>
    <div id="wave"></div>
    <button class="bbtn" id="shovel" title="铲除：拔掉射手" aria-label="铲除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 6-2 2-6-6z" fill="#8d6e63" stroke="#4e342e" stroke-width="1.4" stroke-linejoin="round"/><path d="M13 8l3 3-6.5 6.5-3-3z" fill="#a1887f" stroke="#4e342e" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 13.5l3 3-3.2 3.7c-1 1.1-2.9 1.2-4 .1s-1-3 .1-4z" fill="#90a4ae" stroke="#37474f" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="t">铲除</span></button>
  </div>
  <div id="belt"></div>
  <div id="field"><div id="banner"></div></div>
</div>
<div id="ghost" class="hide"></div>

<div id="modal" class="mask hide"><div class="box" id="mbox"></div></div>

<script src="editions.js"></script>
<script src="word-icons.js"></script>
<script src="audio/manifest.js"></script>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const edId = qs.get('ed') || 'pep';
  const bookId = qs.get('book') || 'g3a';
  const unitId = qs.get('unit') || null;
  const edition = (window.EDITIONS || []).find(e => e.id === edId) || window.EDITIONS[0];

  function loadScript(src, cb) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function () {
      document.getElementById('levels').innerHTML =
        '<div class="lv"><p style="margin:0;text-align:center">词表加载失败，<a href="index.html">返回选教材</a></p></div>';
    };
    document.body.appendChild(s);
  }

  loadScript(edition.wordsFile, function () {
    const books = edition.id === 'pep'
      ? (window.BOOKS || window.BOOKS_BY_EDITION.pep || [])
      : (window.BOOKS_BY_EDITION[edition.id] || []);
    window.BOOKS = books;

    const book = books.find(b => b.id === bookId) || books[0];
    let nextUrl = null;
    if (book && unitId) {
      const idx = book.units.findIndex(u => 'u' + u.no === unitId);
      if (idx >= 0 && idx + 1 < book.units.length) {
        nextUrl = 'play.html?ed=' + encodeURIComponent(edition.id) +
          '&book=' + encodeURIComponent(book.id) +
          '&unit=u' + encodeURIComponent(book.units[idx + 1].no) + '#learn';
      }
    }
    const vol = (window.BOOK_VOLUME_IDS && book) ? window.BOOK_VOLUME_IDS[book.id] : 'volume-0-0';
    window.GAME_CONFIG = {
      editionId: edition.id,
      editionName: edition.name,
      bookId: book ? book.id : bookId,
      unitId: unitId,
      nextUrl: nextUrl,
      homeHash: 'ed=' + encodeURIComponent(edition.id) + '&vol=' + encodeURIComponent(vol)
    };
    try { sessionStorage.setItem('wd-session-ed', edition.id); } catch (e) {}
    loadScript('game.js');
  });
})();
</script>
</body>
</html>
